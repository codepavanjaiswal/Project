services:
  - type: web
    name: mongodb-user-manager-api
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB
        value: html_mongodb_app
      - key: MONGODB_COLLECTION
        value: pavan
